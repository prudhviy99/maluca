name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build and test
        # Redis service + Docker socket are available, so the Redis-backed and
        # Testcontainers tests run for real here (they self-skip locally).
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"

  load-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build jars
        run: ./gradlew bootJar --no-daemon

      - name: Boot backend + proxy
        run: |
          java -jar demo-backend/build/libs/*.jar &
          REDIS_HOST=localhost java -jar maluca-proxy/build/libs/*.jar &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/actuator/health && break || sleep 2
          done

      - name: Smoke latency check (fails if p99 added latency regresses badly)
        run: |
          python3 scripts/bench/latency_bench.py --target http://localhost:8080 \
            --path / --rps 100 --duration 10 --label ci
