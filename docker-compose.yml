services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: maluca-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no   # no persistence needed for dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - maluca-net

  # ── Demo Backend ───────────────────────────────────────────────────────────
  demo-backend:
    build:
      context: .
      dockerfile: demo-backend/Dockerfile
    container_name: maluca-demo-backend
    environment:
      PORT: 8081
    expose:
      - "8081"            # internal only — not published to host
    networks:
      - maluca-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Maluca Proxy ──────────────────────────────────────────────────────────
  maluca-proxy:
    build:
      context: .
      dockerfile: maluca-proxy/Dockerfile
    container_name: maluca-proxy
    ports:
      - "8080:8080"       # public entrypoint — all traffic goes here
    environment:
      PORT: 8080
      UPSTREAM_URL: http://demo-backend:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRUST_XFF: "false"
      MALUCA_CHALLENGE_SECRET: ${MALUCA_CHALLENGE_SECRET:-dev-only-secret-change-me}
      MALUCA_ADMIN_TOKEN: ${MALUCA_ADMIN_TOKEN:-dev-admin-token}
      SPRING_PROFILES_ACTIVE: json-logging
    depends_on:
      redis:
        condition: service_healthy
      demo-backend:
        condition: service_healthy
    networks:
      - maluca-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Observability stack (start with --profile observability) ──────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: maluca-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - maluca-net
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.1.0
    container_name: maluca-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - maluca-net
    profiles:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: maluca-jaeger
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP ingest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - maluca-net
    profiles:
      - observability

networks:
  maluca-net:
    driver: bridge
