# Round-robin load balancer in front of two Maluca instances. Proves the
# shared-state contract: both instances read/write the same Redis, so rate
# limits and decisions are consistent no matter which instance serves a
# given request.

events {}

http {
    upstream maluca {
        server maluca-proxy-1:8080;
        server maluca-proxy-2:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://maluca;
            proxy_set_header Host $host;
            # The instances trust this LB as a proxy; pass the real client IP.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
