server:
  port: ${PORT:8080}
  shutdown: graceful   # let in-flight requests finish on SIGTERM (zero-downtime rolls)

spring:
  application:
    name: maluca-proxy
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  health:
    # Disable Spring's built-in Redis ping check: it reports DOWN on a Redis
    # outage and would aggregate the whole instance to DOWN (503), tripping
    # liveness probes. Our redisBreaker indicator reports the degradation
    # tier as UP-with-detail instead — a degraded Maluca is still serving.
    redis:
      enabled: false
  tracing:
    sampling:
      # 10% default; turn up for debugging, down under heavy load
      probability: ${TRACE_SAMPLING:0.1}
  otlp:
    tracing:
      # Jaeger's OTLP HTTP ingest (run via: docker compose --profile observability up)
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ─── Maluca configuration ─────────────────────────────────────────────────────
maluca:

  # Where allowed traffic is forwarded
  upstream:
    url: ${UPSTREAM_URL:http://localhost:8081}
    connect-timeout-ms: 5000
    response-timeout-ms: 30000
    max-connections: 500

  # Client identity extraction. Only trust XFF behind a known load balancer.
  # strategy: NETWORK (IP only) | COMPOSITE (ip|session|fingerprint) | FINGERPRINT
  identity:
    trust-x-forwarded-for: ${TRUST_XFF:false}
    trusted-proxies: []
    strategy: ${IDENTITY_STRATEGY:NETWORK}
    session-cookie: session
    # Cloud/datacenter ranges that bump score and PoW difficulty.
    # Production: replace with a GeoLite2-ASN lookup. Examples below are
    # well-known cloud blocks for demoing the signal.
    datacenter-cidrs:
      - 3.0.0.0/9          # AWS
      - 34.64.0.0/10       # GCP
      - 104.16.0.0/13      # Cloudflare
      - 159.65.0.0/16      # DigitalOcean
      - 178.62.0.0/16      # DigitalOcean

  # Baseline fixed-window cap; breaching it feeds the score and floors the
  # action at HARD_LIMIT (per-route policies supersede these later)
  limits:
    enabled: true
    max-requests: 30
    window-seconds: 10
    block-threshold-per-60s: 300
    block-minutes: 5

  # Weighted-linear risk scoring. Rate signals ramp linearly above their
  # threshold (value == 2x threshold contributes the full weight, capped at
  # 1.5x). Booleans contribute the full weight.
  scoring:
    weights:
      burst: 40
      sustained: 25
      path-scan: 20
      sensitive: 25
      fourxx: 15
      header-anomaly: 15
      known-bad-bot: 60
      script-client: 15
      unknown-ua: 8
      ua-header-mismatch: 12
      datacenter: 10
      limit-exceeded: 30
      prior-escalation: 20
    thresholds:
      burst-per-10s: 30
      sustained-per-60s: 120
      distinct-paths-per-30s: 15
      sensitive-hits-per-60s: 20
      fourxx-per-60s: 10

  # Score bands -> progressive mitigation actions
  bands:
    observe-min: 30
    soft-limit-min: 50
    hard-limit-min: 65
    challenge-min: 75
    block-min: 90

  # How long an escalated client stays escalated even if its score drops
  hysteresis:
    hard-limit-ttl-seconds: 30
    challenge-ttl-seconds: 120
    block-ttl-seconds: 300

  mitigation:
    soft-limit-delay-ms: 500

  # Redis resilience. Ops are hard-capped at redis-timeout-ms; a slow Redis
  # counts as a failure. After enough failures the breaker opens and the
  # decision path short-circuits to each route's fail-mode.
  resilience:
    redis-timeout-ms: 10
    failure-rate-threshold: 50
    sliding-window-size: 20
    minimum-calls: 10
    open-state-seconds: 10
    fail-open-by-default: true

  # Challenge subsystem. The secret MUST come from the environment in any
  # real deployment; the default exists only so local dev boots.
  challenge:
    secret: ${MALUCA_CHALLENGE_SECRET:dev-only-secret-change-me}
    challenge-ttl-seconds: 120
    pass-ttl-seconds: 300
    base-difficulty-bits: 16
    max-difficulty-bits: 22
    js-lite-max-score: 82

  # Per-route policies. Point at a real file for hot reload; blank falls
  # back to the classpath default (no reload).
  policy-file: ${POLICY_FILE:}

  # Guards /_maluca/admin/*. Blank disables the admin API entirely.
  admin-token: ${MALUCA_ADMIN_TOKEN:}

  # API-key -> tier stub (production: auth-service lookup behind a cache)
  tier-keys:
    demo-pro-key: pro
    demo-enterprise-key: enterprise

  # Paths whose hit counts are tracked separately as a brute-force signal
  sensitive-paths:
    - /login
    - /signup
    - /admin
    - /api/auth
    - /api/checkout
    - /api/payment
    - /reset-password

logging:
  level:
    root: INFO
    com.maluca: DEBUG
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
