server:
  port: ${PORT:8080}

spring:
  application:
    name: maluca-proxy
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always

maluca:
  upstream:
    url: ${UPSTREAM_URL:http://localhost:8081}
    connect-timeout-ms: 5000
    response-timeout-ms: 30000

logging:
  level:
    root: INFO
    com.maluca: DEBUG
